name: ESP-IDF CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4
    defaults:
      run:
        working-directory: ./firmware/IotDesk
    steps:
      - uses: actions/checkout@v4

      # 1. 一次性安装静态分析工具链
      - name: Install Static Analysis Tools
        run: |
          apt-get update
          apt-get install -y clang-format cppcheck

      # 2. 检查代码格式规范 (clang-format)
      - name: Code Format Check
        run: |
          echo "Checking code formatting..."
          find main components -type f \( -name "*.c" -o -name "*.h" \) | xargs clang-format --dry-run --Werror

      # 3. 语法与潜在缺陷扫描 (cppcheck)
      - name: Cppcheck Static Analysis
        run: |
          echo "Running cppcheck..."
          cppcheck --enable=warning,style,performance,portability \
                   --inline-suppr \
                   --error-exitcode=1 \
                   --suppress=missingIncludeSystem \
                   main/ components/